<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing background effect -->
  <circle cx="256" cy="230" r="140" fill="url(#glowGrad)"/>

  <!-- Steering Wheel & Dashboard Graphic -->
  <g filter="url(#shadow)">
    <!-- Outer Steering Wheel Ring -->
    <circle cx="256" cy="240" r="130" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Inner Hub -->
    <circle cx="256" cy="240" r="44" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="12"/>
    <circle cx="256" cy="240" r="18" fill="#34d399"/>

    <!-- Steering Spokes -->
    <!-- Left Spoke -->
    <path d="M126 240 L212 240" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Right Spoke -->
    <path d="M300 240 L386 240" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Bottom Center Spoke -->
    <path d="M256 284 L256 370" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- Speedometer / Profit Pulse Accent -->
  <path d="M160 160 Q 256 100 352 160" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round"/>

  <!-- Currency / Performance Badge -->
  <g transform="translate(330, 310)">
    <rect width="130" height="60" rx="30" fill="#047857" stroke="#34d399" stroke-width="4"/>
    <text x="65" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">R$</text>
  </g>

  <!-- Small text title for high resolution -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#e2e8f0" letter-spacing="4" text-anchor="middle">DRIVER PLANNER</text>
</svg>
